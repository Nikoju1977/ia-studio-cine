name: Studio Niko V6 · Quality Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, HTML and privacy validation
        run: node verify-v5.mjs
      - name: Real video API contract tests (mocked, no GPU usage)
        run: node test-v6.mjs
